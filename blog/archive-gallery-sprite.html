<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picbreeder-VLM · sprite-sheet archive</title>
<style>
  :root { --accent:#FF6C00; --ink:#222; --muted:#777; --line:#e6e6e6;
          --gold:#daa520; --star-off:#c7c7c7; }
  /* Latin Modern italic: the info-layout captions set their titles in the same face as
     the hero banner's hover titles and the system-overview figure's image titles. */
  @font-face {
    font-family:"LM Roman"; font-style:italic; font-weight:400; font-display:swap;
    src:url("assets/fonts/lmroman10-italic.otf") format("opentype");
  }
  body { font-family:"PT Sans",-apple-system,system-ui,sans-serif; color:var(--ink);
         margin:0; padding:22px 26px 64px; background:#fff; }
  h1 { font-size:19px; font-weight:700; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px;
         position:sticky; top:0; z-index:5; background:#fff; padding:6px 0; }   /* float while the standalone page scrolls */
  .seg button { font:inherit; font-size:13px; padding:6px 12px; border:1px solid var(--line);
                background:#fff; cursor:pointer; }
  .seg button:first-child { border-radius:6px 0 0 6px; }
  .seg button:last-child { border-radius:0 6px 6px 0; border-left:none; }
  .seg button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .seg button[disabled] { color:#bbb; background:#f7f7f7; cursor:default; }
  /* nested sub-row (grid sorts / phylogeny variants) — smaller, darker active state */
  .subseg { margin-left:8px; }
  .subseg button { font-size:12px; padding:5px 10px; background:#fafafa; color:#555; }
  .subseg button.on { background:#333; color:#fff; border-color:#333; }
  .subseg:empty { display:none; }
  #info { font-size:12px; color:var(--muted); margin-left:8px; }
  #stage { position:relative; margin-top:8px; }
  /* phylogeny renders larger than the viewport (legible thumbnails) inside a bounded,
     pannable viewport (like the breed Family-Tree page) — scroll both ways to roam it.
     No visible frame: it should read as the same flat white surface as the grid, not a
     separate bordered "canvas". The 1px transparent border keeps the +2 sizing math intact. */
  #stage.phscroll { overflow:hidden; border:1px solid transparent; box-sizing:border-box; background:#fff; }
  #grid { display:block; cursor:crosshair; }
  #grid.immersed { cursor:none; }
  #grid.panning { cursor:grab; }
  #grid.panning:active { cursor:grabbing; }
  /* immersive enters fullscreen so the full-res pan gets a viewport-shaped frame */
  #stage:fullscreen { background:#000; display:flex; align-items:center; justify-content:center; }
  #stage:-webkit-full-screen { background:#000; display:flex; align-items:center; justify-content:center; }
  /* small, unobtrusive keyboard-shortcut cue pinned to the bottom-left of the viewport
     (a child of #stage so it survives fullscreen). Black on a faint white wash so it stays
     legible over the white archive canvas and over any thumbnail that pans under it. */
  /* One pill for all the cues, stacked bottom-left; later cues sit beneath earlier ones
     inside the same wash rather than each carrying their own. */
  #hint { position:fixed; left:12px; bottom:12px; z-index:10; display:none;
          flex-direction:column; align-items:flex-start; gap:4px;
          background:rgba(255,255,255,.72); padding:4px 8px; border-radius:5px;
          pointer-events:none; user-select:none; }
  #hint.on { display:flex; }
  #hint div { font-size:12px; line-height:1; color:#111; letter-spacing:.02em; }
  #hint b { color:#111; font-weight:700; }
  #status { font-size:13px; color:var(--muted); }
  #status.err { color:#c0392b; }
  #loupe { position:fixed; border-radius:50%; pointer-events:none; display:none; z-index:9;
           box-shadow:0 6px 28px rgba(0,0,0,.4); background:#eee; image-rendering:pixelated; }
  #loupe.on { display:block; }
  /* a programmatic "focus" loupe (hero double-click) is anchored to the document
     so it rides with the canvas as the page scrolls, unlike the hover loupe which
     tracks the cursor in viewport coords. A ring marks the focused image. */
  #loupe.focus { position:absolute; box-shadow:0 6px 28px rgba(0,0,0,.45), 0 0 0 3px var(--accent); }
  /* embed: no inner scrollbar — the host iframe is sized to our content height (see postHeight).
     overflow:hidden also stops a transient scrollbar from stealing width and starting an
     autosize oscillation (scrollbar -> narrower -> shorter -> no scrollbar -> ...). */
  body.embed { padding:8px 4px 16px; overflow:hidden; }
  body.embed h1, body.embed .sub { display:none; }
  body.embed .bar { display:none; }   /* embed: the ordering toggle lives in the host's sticky header instead */
</style>
</head>
<body>
  <h1>Published archive <span style="color:var(--accent)">· sprite sheets</span></h1>
  <p class="sub">Hover for a full-res loupe; <b>click</b> to lock the pointer and pan the archive at full res. Toggle ordering with no refetch.</p>
  <div class="bar">
    <span class="seg" id="seg"></span>
    <span class="seg subseg" id="subseg"></span>
    <span id="info"></span>
  </div>
  <div id="status">Loading sheets&hellip;</div>
  <div id="stage"><div id="hint"></div></div>
  <canvas id="loupe"></canvas>

<script>
(function () {
  const HF_BASE = "https://huggingface.co/datasets/picbreeder-vlm/picbreeder-vlm-archive/resolve/main";
  const params = new URLSearchParams(location.search);
  const ARCHIVE_BASE = (params.get("archiveBase") || HF_BASE).replace(/\/$/, "");
  let run = params.get("run") || "";
  const wantArc = params.get("arc"), wantSeed = params.get("seed"), wantModel = params.get("model");
  const DEFAULT_MODEL = "gemini-2.5-pro";          // the canonical model; others are an orthogonal axis
  const MODEL_PREF = ["gemini-2.5-pro", "gemini-3-pro-preview", "gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-random"];
  const modelOf = (e) => e.model || (e.config && e.config.model) || DEFAULT_MODEL;
  const FIXED_CELL = params.has("cell") ? parseInt(params.get("cell"), 10) : null;
  const LENS = parseInt(params.get("lens") || "320", 10);   // loupe diameter px
  const PAN_SPEED = parseFloat(params.get("panspeed") || "1.2");
  const LOUPE_FRAC = parseFloat(params.get("loupefrac") || "0.667");  // 0=grid size, 1=full native res
  const ORDER_LABELS = { chronological: "Chronological", siglip: "SigLIP-sorted", branched: "Most Branched", ratings: "Top Rated", phylogeny: "Phylogeny", growth: "Growth" };
  const ORDER_PREF = ["chronological", "siglip", "branched", "ratings", "phylogeny", "growth"];   // display order; unknown keys appended
  // "growth" is a synthetic ordering: not a stored layout, but an animated playback
  // of the phylogeny filling in publication order. Available whenever the run has a
  // (scatter) phylogeny layout to borrow positions + edges from.
  const orderKeys = () => Object.keys(layout.layouts).sort((a, b) => {
    const ia = ORDER_PREF.indexOf(a), ib = ORDER_PREF.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  // Full canonical button set (every ordering the gallery knows about), so a run that lacks
  // one — e.g. the human archive has no VLM "Top Rated" — still shows it, greyed, rather than
  // dropping the button. = ORDER_PREF, plus any present-but-unlisted keys appended.
  const allOrderKeys = () => ORDER_PREF.concat(orderKeys().filter((k) => ORDER_PREF.indexOf(k) < 0));
  const hasScatter = () => !!(layout && orderKeys().some(isScatter));
  let morphRuns = new Set();                          // runs with a prebuilt scrubbable-morph layout (breed/data/morph/<run>/)
  const hasMorph = () => morphRuns.has(run);          // gates the Morph meta-button (the embedded viewer needs that layout)
  let transcriptRuns = new Set();                     // runs with a built transcript wall listed in the committed manifest (assets/transcripts/<run>/)
  // Gates the Transcripts meta-button: either the committed manifest lists this run, OR we
  // found a wall live on HF (hfWallRuns) — so walls built & pushed after the manifest was
  // baked light up without a blog redeploy. Greyed (with a reason tooltip) when neither holds.
  const hasTranscripts = () => transcriptRuns.has(run) || hfWallRuns.has(run);
  const isHumanArc = () => resolvedArc === "human";
  // Human t'scripts: original Picbreeder never recorded the breeder's thoughts. AI runs
  // that lack a wall DO have raw reasoning on HF (results/<run>/), just not a built wall yet.
  function metaReason(m) {                             // why meta m is greyed (only called when !metaPresent(m))
    if (m === "transcripts") return isHumanArc()
      ? "Users’ thoughts were not recorded in the original Picbreeder."
      : "Reasoning traces for this run are on HF, but a transcript wall hasn’t been built for it yet.";
    if (m === "phylogeny") return "No phylogeny (family-tree) layout was built for this run.";
    if (m === "growth")    return "Growth animates the phylogeny, which wasn’t built for this run.";
    if (m === "morph")     return "No scrubbable-morph layout was built for this run.";
    if (m === "grid")      return "No image grid is available for this run.";
    return "Not available for this run.";
  }
  function subReason(k) {                              // why grid sort k is greyed
    const label = orderLabel(k);
    return isHumanArc()
      ? "The human archive has no VLM “" + label + "” ordering."
      : "The “" + label + "” ordering isn’t available for this run.";
  }
  const hasOrder = (k) => k === "growth" ? hasScatter() : !!(layout && layout.layouts[k]);
  const orderLabel = (k) => ORDER_LABELS[k] || (k[0].toUpperCase() + k.slice(1));
  // ---- meta-categories ----
  // The grid sorts (chronological/siglip/branched/ratings) collapse under a single "Grid"
  // meta-button with a sub-row, alongside Phylogeny (its own radial/twopi/sfdp sub-row) and
  // Growth. This mirrors the existing phylogeny-variant sub-toggle pattern: a meta-button picks
  // the category, the sub-row picks the exact ordering/variant within it.
  const META_LABELS = { grid: "Grid", phylogeny: "Phylogeny", morph: "Morph", growth: "Growth", transcripts: "Transcripts" };
  const META_PREF = ["grid", "phylogeny", "morph", "growth", "transcripts"];
  const GRID_PREF = ["chronological", "siglip", "branched", "ratings"];   // grid sub-orderings, display order
  const PHY_PREF = ["tidy", "radial", "twopi", "sfdp"];   // phylogeny variant display order — the breed-style "tidy" radial (default) leftmost
  // variant keys in display order: preferred first (so Radial leads), any others appended
  const phyloVariants = (L) => { const ks = (L && (L.variant_order || (L.variants && Object.keys(L.variants)))) || [];
    return PHY_PREF.filter((v) => ks.indexOf(v) >= 0).concat(ks.filter((k) => PHY_PREF.indexOf(k) < 0)); };
  const isGridKey = (k) => k !== "growth" && !!(layout && layout.layouts[k]) && !isScatter(k);
  const scatterKey = () => orderKeys().find(isScatter);                   // the (single) phylogeny layout key, if any
  const metaOf = (k) => k === "growth" ? "growth" : k === "morph" ? "morph" : k === "transcripts" ? "transcripts"
                      : (layout && layout.layouts[k] && isScatter(k)) ? "phylogeny" : "grid";
  const metaPresent = (m) => m === "grid" ? orderKeys().some(isGridKey)
                           : m === "morph" ? hasMorph()
                           : m === "transcripts" ? hasTranscripts()
                           : hasScatter();   // phylogeny & growth need a scatter layout; morph/transcripts need prebuilt data
  const firstAvailGrid = () => GRID_PREF.find(isGridKey) || orderKeys().find(isGridKey);
  // canonical grid sorts first, then any present-but-unlisted grid ordering appended (matches the old allOrderKeys robustness)
  const gridSubKeys = () => GRID_PREF.concat(orderKeys().filter((k) => isGridKey(k) && GRID_PREF.indexOf(k) < 0));
  const currentMeta = () => metaOf(currentKey);
  const currentSub = () => { const m = currentMeta(); return m === "grid" ? currentKey : m === "phylogeny" ? activeVariant : null; };
  let DC = FIXED_CELL || 20, base = "", runBase = ARCHIVE_BASE;   // runBase: per-run host (index entry may override, e.g. human row on gh-pages)
  const DEFAULT_SEED = "4";          // when no ?seed given, prefer the canonical replicate seed (s4)
  let availSeeds = [], resolvedSeed = null;   // seeds with sprites for this arc(+model) + the one we loaded (for the host's seed sub-toggle)
  let availModels = [], resolvedModel = null; // models with sprites for this arc + the one we loaded (for the host's model sub-toggle)
  let allModels = [], modelArcs = {};          // every model present anywhere + model -> arcs it was run in, so the host can show ALL
                                               // models on the sub-toggle even for an arc that lacks some, and snap the arc on click.
  let resolvedArc = null;                      // the arc this run belongs to (drives the "why greyed" tooltips, esp. the human archive)
  let hfWallRuns = new Set();                  // runs whose transcript wall we found live on HF (built + pushed after the committed manifest was baked)
  if (params.has("embed")) document.body.classList.add("embed");

  const $ = (id) => document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const status = (m, err) => { $("status").innerHTML = m; $("status").className = err ? "err" : ""; };
  const DEFAULT_STATUS = "Hover = loupe · click = fullscreen + pan full-res (Esc/click to exit) · toggle ordering above.";
  const GROWTH_STATUS = "";   // growth mode shows no status line — the scrub/play controls speak for themselves
  const sheetFile = (sp, s) => sp.sheet_tmpl.replace("{s:03d}", String(s).padStart(3, "0"));

  async function getJSON(p) {
    const r = await fetch(base + p, { mode: "cors" });
    if (!r.ok) throw new Error("HTTP " + r.status + " " + p);
    return r.json();
  }
  function packPos(sp, i) {
    const within = i % sp.per_sheet;
    return { sheet: Math.floor(i / sp.per_sheet),
             sx: (within % sp.sheet_cols) * sp.cell,
             sy: Math.floor(within / sp.sheet_cols) * sp.cell };
  }

  // ---- canvas grid + morph + immersive (all one main canvas) ----
  let SP, layout, sheetImgs = [], gridIndex = new Map();
  let currentKey = "chronological", gridDims = [0, 0], scatterEdges = null, activeVariant = null;
  let immersed = false, panX = 0, panY = 0, gz = 1, morphing = false;   // gz: grid-immersive zoom (wheel/pinch), 1 = native res
  let pendingKey = null;   // ordering requested mid-morph; applied when the current morph lands (so fast grid-sort clicks aren't dropped)
  // free pan+zoom over the phylogeny tree at native res (separate from the grid's wrap-pan)
  let immScatter = false, iz = 1, iox = 0, ioy = 0;
  // "tidy" is the breed Family-Tree radial (Reingold–Tilford), computed in-browser; it
  // supersedes the old graphviz "radial" as the canonical Radial view (which is dropped
  // from the sub-row when tidy is present, but kept labelled for any run that lacks it).
  const SUB_LABELS = { tidy: "Radial", radial: "Radial (graphviz)", twopi: "Twopi", sfdp: "sfdp" };
  const cv = document.createElement("canvas"); cv.id = "grid";
  const ctx = cv.getContext("2d");
  const loupe = $("loupe"), lctx = loupe.getContext("2d");

  // A "scatter" layout (e.g. phylogeny) places each image at a free normalized
  // (x,y) in the unit square + carries parent->child edges, instead of a grid.
  const isScatter = (k) => !!(layout.layouts[k] && layout.layouts[k].kind === "scatter");

  // ---- "tree of life" radial layout, computed in-browser -----------------------
  // The stored phylogeny variants (radial/twopi/sfdp) are graphviz output, which tangles
  // at the VLM runs' high branching factor. We instead lay the whole forest out as a
  // circular dendrogram, the clean tree-of-life form: a size-aware Reingold–Tilford pass
  // (each node claims angular room ∝ its descendants and sits at its children's angular
  // midpoint, so no edge crosses) gives every node an angle; we then set radius = its tree
  // DEPTH (founders at the center, leaves at the rim) and normalize the frontier to a
  // single full turn. Drawn with curved radial links (see strokeBranches) it reads as
  // concentric rings of lineage. Result is in the unit square so it slots into the existing
  // variant machinery (morph / loupe / immersive) unchanged. Computed from the loaded edges.
  function computeTidyRadial(N, edges) {
    const parent = new Array(N).fill(-1), children = Array.from({ length: N }, () => []);
    for (let k = 0; k < edges.length; k++) {
      const p = Math.min(edges[k][0], edges[k][1]), c = Math.max(edges[k][0], edges[k][1]);   // parent = earlier-published (smaller index)
      if (p !== c) { parent[c] = p; children[p].push(c); }
    }
    const roots = []; for (let i = 0; i < N; i++) if (parent[i] < 0) roots.push(i);
    // subtree sizes → order siblings biggest-first (tidy: the big branches lead)
    const size = new Array(N).fill(1);
    const sizeOf = (id) => { let s = 1; const ch = children[id]; for (let i = 0; i < ch.length; i++) s += sizeOf(ch[i]); return (size[id] = s); };
    roots.forEach(sizeOf);
    const cmp = (a, b) => (size[b] - size[a]) || (a - b);
    for (let i = 0; i < N; i++) if (children[i].length > 1) children[i].sort(cmp);
    roots.sort(cmp);
    // a virtual super-root (id = N) gathers the whole forest into one disc
    const ROOT = N, kidsOf = (id) => id === ROOT ? roots : children[id];
    const ext = new Float64Array(N + 1), ang = new Float64Array(N + 1), depth = new Int32Array(N);
    // angular extent = its leaf count (≥1) → leaves spread evenly, big clades get more of the circle
    const measure = (id) => { const ch = kidsOf(id); if (!ch.length) return (ext[id] = 1); let sum = 0; for (let i = 0; i < ch.length; i++) sum += measure(ch[i]); return (ext[id] = sum); };
    const place = (id, dep, a0) => {
      const ch = kidsOf(id);
      let a;
      if (!ch.length) a = a0 + ext[id] / 2;
      else {
        let cur = a0; for (let i = 0; i < ch.length; i++) { place(ch[i], dep + 1, cur); cur += ext[ch[i]]; }
        a = (ang[ch[0]] + ang[ch[ch.length - 1]]) / 2;   // parent at its children's angular midpoint -> no crossings
      }
      ang[id] = a;
      if (id !== ROOT) depth[id] = dep;
    };
    measure(ROOT); place(ROOT, 0, 0);
    const total = ext[ROOT] || 1;
    let maxDepth = 1; for (let i = 0; i < N; i++) if (depth[i] > maxDepth) maxDepth = depth[i];
    // depth -> radius (founders inner, leaves out); small inner offset so the founder ring isn't a
    // point, and sqrt so the crowded shallow rings get a little more room than a linear scale.
    const xy = new Array(N);
    for (let i = 0; i < N; i++) {
      const a = (ang[i] / total) * 2 * Math.PI, r = 0.07 + 0.93 * Math.sqrt(depth[i] / maxDepth);
      xy[i] = [0.5 + 0.5 * r * Math.cos(a), 0.5 + 0.5 * r * Math.sin(a)];
    }
    return xy;
  }

  // ---- phylogeny (scatter) inline sizing ---------------------------------------
  // A radial tree-of-life is a disc: its populated rings sit in an annulus around an empty
  // founder core, so the whole disc has to be in view at once (enlarging + centering would
  // just frame the empty middle). We therefore FIT the disc into a bordered SQUARE viewport
  // sized to the full window WIDTH (a tall square the page scrolls past) for a clean, large
  // overview; a click drops into the full-res immersive pan/zoom for legible detail. The
  // thumbnails are deliberately small (overview) and overlap into clades.
  // Available CSS px for the inline tree square: the full content width of the page.
  // Measure the BODY content box (not #stage — sizeCanvas() constrains #stage's width to
  // the square in phscroll mode, so reading it back would feed the square's own size in).
  const availWidth = () => Math.max(320, (document.body.clientWidth || 1000) - (document.body.classList.contains("embed") ? 8 : 52));
  const phySide = () => clamp(availWidth(), 320, 2000);                   // square side (CSS px) = full content width
  const phyCell = () => clamp(phySide() * 0.018, 10, 24);                 // on-screen thumbnail px in the inline tree
  const curCell = () => isScatter(currentKey) ? phyCell() : DC;           // thumbnail draw size for the active view
  // Unit-space bounding box of the active scatter variant. A radial tree rarely fills the
  // whole [0,1] square — the tidy human disc, say, lives in y[0.16,0.86], x[0.05,0.80] —
  // so fitting it into a full square leaves dead margins (a tall empty band at top) and an
  // oversized, internally-scrolling box. We crop to this bbox so the disc fills the canvas
  // and the host iframe ends up exactly as tall as the tree (like the grid views). Cached
  // per variant (keyed by name + node count).
  const _phyBoxCache = {};
  function phyBounds(L) {
    const xy = scatterXY(L);
    if (!xy || !xy.length) return { x0: 0, y0: 0, x1: 1, y1: 1 };
    const key = activeVariant + "@" + xy.length;
    if (_phyBoxCache[key]) return _phyBoxCache[key];
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < xy.length; i++) {
      const p = xy[i];
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    }
    if (!isFinite(x0)) { x0 = 0; y0 = 0; x1 = 1; y1 = 1; }
    return (_phyBoxCache[key] = { x0, y0, x1, y1 });
  }
  function centerPhyScroll() {                       // open the tree centered; user scrolls out in any direction
    if (!isScatter(currentKey)) return;
    const st = $("stage");
    st.scrollLeft = Math.max(0, (cv.clientWidth - st.clientWidth) / 2);
    st.scrollTop = Math.max(0, (cv.clientHeight - st.clientHeight) / 2);
  }

  function maxDims() {                     // grid extent (scatter layouts impose no grid -> skipped)
    let r = 0, c = 0;
    for (const k in layout.layouts) {
      const d = layout.layouts[k].dims; if (!d) continue;
      r = Math.max(r, d[0]); c = Math.max(c, d[1]);
    }
    return [r, c];
  }
  // Rows the ordering on screen actually fills. The orderings of one run pack to different
  // extents (siglip is 50x40 where chronological is 45x45), so a canvas at the union height
  // — maxDims — strands dead rows under the shorter ones, and the host iframe, sized to our
  // content, lets the reader scroll down into that void. Size to the live ordering instead;
  // morphTo() widens us to span both endpoints for the length of the tween.
  let morphRows = 0;                      // rows the in-flight grid morph needs (0 = not morphing)
  function rowsOf(key) { const d = layout.layouts[key] && layout.layouts[key].dims; return d ? d[0] : maxDims()[0]; }
  function gridRows() { return morphRows || rowsOf(currentKey); }
  function computeDC() {
    if (FIXED_CELL) return FIXED_CELL;
    const st = $("stage");                         // measure the actual content box (handles embed vs standalone padding)
    const avail = (st && st.clientWidth) || ((document.body.clientWidth || 1000) - (document.body.classList.contains("embed") ? 8 : 52));
    // fractional cell so cols*cell == avail exactly (no right-edge remainder strip); cap at native res
    return Math.max(2, Math.min(SP.cell, avail / maxDims()[1]));
  }
  function sizeScatterCanvas(w, h, box) {            // size the tree canvas (+ its bordered box) to a given pixel extent
    cv.style.width = w + "px"; cv.style.height = h + "px";
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const st = $("stage");
    st.classList.toggle("phscroll", box);
    st.style.height = box ? (h + 2) + "px" : "";     // +2 for the 1px border each side (border-box) so the rim isn't clipped
    st.style.width  = box ? (w + 2) + "px" : "";
    st.style.margin = box ? "8px auto 0" : "";       // center the cropped box on the page
  }
  function sizeCanvas() {
    if (infoOn()) { sizeCanvasInfo(); return; }       // ranked-grid info layout: thumbnails spaced out + caption strips
    if (isScatter(currentKey)) {                     // phylogeny: the disc cropped to its bbox into a bordered viewport
      const b = phyBounds(layout.layouts[currentKey]);
      const cell = phyCell(), S = Math.max(1, phySide() - cell);

        if (isScatter(currentKey)) drawLoupeScatter(mx, my); else if (infoOn()) drawLoupeInfo(mx, my); else drawLoupe(mx, my);
        loupe.style.left = (e.clientX - LENS / 2) + "px";
        loupe.style.top = (e.clientY - LENS / 2) + "px";
        loupe.classList.add("on");
      });
      cv.addEventListener("mouseleave", () => {
        if (immersed) return;
        // A parked focus loupe outlives the cursor wandering off the canvas — it marks the
        // image, it doesn't follow the pointer. If the cursor left mid-glide, re-park it.
        if (focusIdx !== null) {
          if (focusGrab) {
            focusGrab = false;
            if (focusRAF) { cancelAnimationFrame(focusRAF); focusRAF = 0; }
            refreshFocusLoupe();
          }
          return;
        }
        loupe.classList.remove("on");
      });
      cv.addEventListener("click", (e) => {
        if (growing) return;                              // growth mode owns the canvas (scrub via its bar)
        // In either immersive mode a click releases the pointer lock; the
        // pointerlockchange handler then tears the mode down (matches the grid).
        if (immersed || immScatter) { document.exitPointerLock && document.exitPointerLock(); return; }
        // Mid-glide, the loupe is the active point — pan from what the reader can see, not
        // from the cursor it hasn't caught yet. A click made while the loupe is still parked
        // across the canvas abandons it and acts at the cursor, like any other click.
        if (focusIdx !== null) {
          const grabbed = focusGrab, gx = focusCX, gy = focusCY;
          dropFocus(); status(DEFAULT_STATUS);
          if (grabbed && !isScatter(currentKey)) { enterImmersive(gx, gy); return; }
        }
        const r = cv.getBoundingClientRect();
        if (isScatter(currentKey)) enterScatterImmersive(e.clientX - r.left, e.clientY - r.top);
        else enterImmersive(e.clientX - r.left, e.clientY - r.top);
      });
      // Right-click while zoomed in -> go to the focused image's breed detail page. The pointer
      // is locked (cursor parked at the viewport centre), so "focused" = the image under the
      // centre crosshair. The gesture rides on mousedown (contextmenu can be suppressed under
      // pointer lock); the contextmenu listener only cancels the OS menu.
      cv.addEventListener("contextmenu", (e) => { if (immersed || immScatter) e.preventDefault(); });
      cv.addEventListener("mousedown", (e) => {
        if (e.button !== 2 || (!immersed && !immScatter)) return;
        e.preventDefault();
        const i = immersedFocusIndex();
        if (i == null || !run) return;
        const gid = "img_" + String(i + 1).padStart(6, "0");   // sprite index -> genome id (matches breed/detail.html)
        const url = new URL("breed/detail.html?run=" + encodeURIComponent(run) + "&id=" + gid, location.href).href;
        // Navigate the current tab. Embedded, we're an iframe filling the fullscreen stage, so
        // point the top window at the detail page rather than stranding it inside the frame.
        // (Cross-origin embedding would throw on window.top.location — fall back to our own.)
        try { (window.top || window).location.href = url; }
        catch (err) { window.location.href = url; }
      });
      let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(relayout, 120); });

      buildBar();
      // tell the host (if embedded) which meta-categories exist + which is active, so it can build
      // its sticky toggle. Each meta with sub-options advertises them for a nested sub-row:
      //   grid -> the four grid sorts (each a real ordering); phylogeny -> its position variants.
      if (params.has("embed") && window.parent !== window) {
        const subs = {}, subAvail = {}, subIsOrder = {}, metaRep = {}, subCurrent = {};
        if (orderKeys().some(isGridKey)) {          // grid sorts collapse under the "Grid" meta-button
          subs.grid = gridSubKeys();
          subs.grid.forEach((k) => subAvail[k] = isGridKey(k));   // grey grid sorts this run lacks (e.g. Top Rated on the human archive)
          subIsOrder.grid = true;                                 // grid subs are full orderings, not in-layout variants
          metaRep.grid = firstAvailGrid();                        // representative ordering to load when "Grid" is clicked
          subCurrent.grid = currentMeta() === "grid" ? currentKey : firstAvailGrid();
        }
        const sk = scatterKey();
        if (sk) {                                   // phylogeny meta carries its radial/twopi/sfdp variants
          const L = layout.layouts[sk];
          if (L.variants) { subs.phylogeny = phyloVariants(L); subs.phylogeny.forEach((v) => subAvail[v] = true); }
          metaRep.phylogeny = sk;                   // selecting the meta loads the scatter layout itself
          subCurrent.phylogeny = activeVariant;
        }
        metaRep.morph = "morph";   // morph has no sub-row; selecting the meta mounts the embedded viewer
        metaRep.transcripts = "transcripts";   // transcripts likewise has no sub-row
        metaRep.growth = "growth";
        // "Why greyed" tooltips for the host to hang on its disabled buttons.
        const metaReasons = {}; META_PREF.forEach((m) => { if (!metaPresent(m)) metaReasons[m] = metaReason(m); });
        const subReasons = {}; Object.keys(subAvail).forEach((s) => { if (!subAvail[s]) subReasons[s] = subReason(s); });
        try { window.parent.postMessage({ pbvlmReady: true,
          orderings: META_PREF.filter(metaPresent), allOrderings: META_PREF,
          current: startMorph ? "morph" : startTranscripts ? "transcripts" : startGrowth ? "growth" : currentMeta(), labels: META_LABELS,
          subOrderings: subs, subLabels: Object.assign({}, ORDER_LABELS, SUB_LABELS),
          subAvailable: subAvail, subIsOrder: subIsOrder, metaRep: metaRep, subCurrent: subCurrent,
          metaReasons: metaReasons, subReasons: subReasons,
          seeds: availSeeds, currentSeed: resolvedSeed,
          models: availModels, currentModel: resolvedModel,
          allModels: allModels, modelArcs: modelArcs }, "*"); } catch (e) {}
      }
      $("info").innerHTML = sp.n + " images";
      if (startMorph) selectOrder("morph");           // host asked to resume Morph mode
      else if (startTranscripts) selectOrder("transcripts");   // host asked to resume Transcripts mode
      else if (startGrowth) selectOrder("growth");    // host asked to resume Growth mode (needs setup after first render)
      status(currentKey === "growth" ? GROWTH_STATUS : DEFAULT_STATUS);
      postHeight();
    } catch (e) {
      status("Couldn't load sprites (" + e.message + ")." +
        (ARCHIVE_BASE === HF_BASE ? " The dataset isn't public yet—try ?archiveBase=. against a local mirror." : ""), true);
    }
  })();

  // highlight the active meta-button + (re)build its sub-row, highlighting the active sub.
  // Callers pass the target ordering key (during a morph currentKey may still be the old one).
  function setActiveBtn(key) {
    const m = metaOf(key), sub = m === "grid" ? key : m === "phylogeny" ? activeVariant : null;
    [...$("seg").children].forEach((b) => b.classList.toggle("on", b.dataset.meta === m));
    buildSubBar(m, sub);
  }
  function buildSubBar(meta, sub) {        // the nested sub-row for the active meta (grid sorts / phylogeny variants)
    const ss = $("subseg"); ss.innerHTML = "";
    let items = [], isOrder = false;
    if (meta === "grid") { items = gridSubKeys(); isOrder = true; }
    else if (meta === "phylogeny") { const L = layout.layouts[scatterKey()]; if (L && L.variants) items = phyloVariants(L); }
    items.forEach((s) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.sub = s;
      b.textContent = isOrder ? orderLabel(s) : (SUB_LABELS[s] || s);
      if (isOrder && !isGridKey(s)) { b.disabled = true; b.title = subReason(s); ss.appendChild(b); return; }   // grey grid sorts this run lacks (hover = why)
      b.classList.toggle("on", s === sub);
      b.onclick = () => { if (immersed || immScatter) return; if (isOrder) selectOrder(s); else morphVariant(s); };
      ss.appendChild(b);
    });
    ss.style.display = items.length ? "" : "none";
  }
  function buildBar() {                    // meta toggle: Grid / Phylogeny / Growth, greying metas this run lacks
    const seg = $("seg"); seg.innerHTML = "";
    META_PREF.forEach((m) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.meta = m; b.textContent = META_LABELS[m];
      if (!metaPresent(m)) { b.disabled = true; b.title = metaReason(m); seg.appendChild(b); return; }   // hover = why greyed
      b.classList.toggle("on", m === currentMeta());
      b.onclick = () => { if (immersed || immScatter) return; selectMeta(m); };
      seg.appendChild(b);
    });
    buildSubBar(currentMeta(), currentSub());
  }
  // pick a meta-category: load its representative ordering (the sub-row then refines within it)
  function selectMeta(m) {
    if (m === currentMeta()) return;
    selectOrder(m === "growth" ? "growth" : m === "morph" ? "morph" : m === "transcripts" ? "transcripts"
              : m === "phylogeny" ? scatterKey() : firstAvailGrid());
  }
  // host's sticky toggle drives the ordering via postMessage
  window.addEventListener("message", (e) => {
    const d = e.data; if (!d || immersed || immScatter) return;
    if (d.pbvlmInfo) { toggleInfo(); return; }   // host forwarded the "i" info-layout toggle
    if (typeof d.pbvlmFocus === "number" && layout) { focusImage(d.pbvlmFocus); return; }
    if (d.pbvlmOrder === "growth" || d.pbvlmOrder === "morph" || d.pbvlmOrder === "transcripts" || (d.pbvlmOrder && layout && layout.layouts[d.pbvlmOrder])) selectOrder(d.pbvlmOrder);
    else if (d.pbvlmSubOrder) {
      if (layout && layout.layouts[d.pbvlmSubOrder]) selectOrder(d.pbvlmSubOrder);   // a grid sort = a real ordering
      else if (!growing) morphVariant(d.pbvlmSubOrder);                              // a phylogeny position variant
    }
  });
})();
</script>
</body>
</html>
